services:
  # 后端 API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: paper-review-backend
    restart: unless-stopped
    env_file:
      - .env
    # 方案 A：host 网络（推荐，容器和宿主机共享网络，LiteLLM 代理直接用 127.0.0.1）
    # 取消下面一行的注释使用 host 网络
    # network_mode: host
    ports:
      - "8000:8000"
    volumes:
      - ./server/data:/app/data  # 历史记录持久化

  # 前端（Nginx 服务）
  frontend:
    image: nginx:alpine
    container_name: paper-review-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./client/dist:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
